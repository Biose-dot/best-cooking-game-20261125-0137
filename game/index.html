<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIM &amp; GRAVY — Monster Tavern Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d130b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="GRIM and GRAVY, a monster tavern cooking game: chop, grill and brew ingredients, plate the dish, serve the monsters before they lose patience"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
